server {
    listen 443 ssl http2;
    server_name openclimatemap.org;       # your domain

    # SSL certs
    ssl_certificate /etc/letsencrypt/live/openclimatemap.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/openclimatemap.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Compress text-based responses (PNG/PBF tiles are already compressed by upstream)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/x-javascript
        text/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/x-protobuf
        application/wasm
        text/css
        text/plain
        text/xml
        image/svg+xml
        font/woff
        font/woff2;

    # proxy /tiles/ -> TileServer-GL
    location /tiles/ {
        proxy_pass       http://127.0.0.1:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tile content is content-addressed (path includes data type and z/x/y).
        # Allow long browser + intermediate caching to avoid revalidation per page load.
        # 1 day fresh, then up to 7 more days serving stale while revalidating in
        # the background. Lets re-rendered tiles propagate to returning users
        # within ~8 days without any hard refresh.
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # proxy /api/ -> FastAPI
    # Cache-Control headers are owned by the application (see api/main.py).
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Angular SPA at /
    root /home/bart/climatemaps-client;
    index index.html;

    # Redirect stale external links to the canonical Angular route
    location = /about.html {
        return 301 https://openclimatemap.org/about;
    }

    # Hashed Angular build artifacts (e.g. main-2FHPZ6KO.js, styles-YQLXKJMS.css) are
    # immutable: the file name changes whenever the content does.
    location ~* "-[A-Z0-9]{8,}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Never cache the SPA shell so users immediately pick up new deploys.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # serve files if they exist, otherwise fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.openclimatemap.org;
    
    # SSL certs for www subdomain
    ssl_certificate /etc/letsencrypt/live/openclimatemap.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclimatemap.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    return 301 https://openclimatemap.org$request_uri;
}

server {
    listen 80;
    server_name www.openclimatemap.org;
    return 301 https://openclimatemap.org$request_uri;
}

server {
    if ($host = openclimatemap.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name openclimatemap.org;
    return 404; # managed by Certbot
}
