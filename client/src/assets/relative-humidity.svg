  <path d="M16 5C16 5 11 10.5 11 14.5C11 17.26 13.24 19.5 16 19.5C18.76 19.5 21 17.26 21 14.5C21 10.5 16 5 16 5Z" fill="url(#humidity_gradient)" stroke="#424242" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
