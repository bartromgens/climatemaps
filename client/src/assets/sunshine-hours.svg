<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun core -->
  <circle cx="12" cy="10" r="4" fill="#FFD600" stroke="#424242" stroke-width="1.5"/>
  
  <!-- Rays -->
  <line x1="12" y1="2.5" x2="12" y2="4.5" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4.5" y1="10" x2="6.5" y2="10" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="17.5" y1="10" x2="19.5" y2="10" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
  
  <line x1="6.34" y1="4.34" x2="7.76" y2="5.76" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16.24" y1="5.76" x2="17.66" y2="4.34" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Clock element to represent hours -->
  <circle cx="12" cy="18" r="3.5" fill="none" stroke="#424242" stroke-width="1.5"/>
  <line x1="12" y1="18" x2="12" y2="16" stroke="#424242" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="14" y2="18" stroke="#424242" stroke-width="1.2" stroke-linecap="round"/>
</svg>

